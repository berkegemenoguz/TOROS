<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>TOROS - Teslimat Optimizasyonu</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="/static/toros.css">
<style>
  body { height: 100vh; }
  .alt-govde { display: flex; flex: 1; min-height: 0; }
  .ust-bar { flex-shrink: 0; }

  .panel {
    width: 400px; background: var(--surface); overflow-y: auto; padding: 24px 20px;
    border-right: 1px solid var(--border); flex-shrink: 0; z-index: 500;
  }
  .panel h1 { font-size: 24px; font-weight: 800; color: var(--brand); letter-spacing: 1px; }
  .panel .alt-baslik {
    font-size: 10px; letter-spacing: 3px; color: var(--text-muted);
    text-transform: uppercase; margin: 2px 0 12px;
  }
  .filo-link { color: var(--brand); font-size: 12px; text-decoration: none; display: block; margin-bottom: 10px; font-weight: 600; }
  .filo-link:hover { text-decoration: underline; }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text-2); margin: 18px 0 8px; font-weight: 600;
  }

  .form-grup { margin-bottom: 10px; }

  .depo-alan { background: var(--surface-2); border: 1px solid var(--border); padding: 14px; border-radius: var(--radius); margin-bottom: 15px; }
  .depo-alan .form-grup { margin-bottom: 6px; }

  .teslimat-listesi { margin-bottom: 15px; }
  .teslimat-karti {
    background: var(--surface-2); border: 1px solid var(--border); padding: 6px 10px; border-radius: var(--radius);
    margin-bottom: 4px; position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .teslimat-karti .sil-btn {
    background: none; border: none;
    color: var(--brand); cursor: pointer; font-size: 16px; flex-shrink: 0;
  }
  .teslimat-karti .form-grup { margin-bottom: 0; }
  .teslimat-karti .form-grup label { font-size: 10px; margin-bottom: 1px; }
  .teslimat-karti .form-grup input { padding: 3px 6px; font-size: 12px; }

  .btn-ara {
    background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border-strong); padding: 8px 12px;
    border-radius: var(--radius); cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .btn-ara:hover { border-color: var(--brand); color: var(--brand); }
  .adres-satir { display: flex; gap: 6px; }
  .adres-satir input { flex: 1; }
  .satir { display: flex; gap: 6px; }
  .btn-hesapla {
    background: var(--brand); color: #fff; width: 100%; font-size: 15px; padding: 12px;
    border: none; border-radius: var(--radius); cursor: pointer; font-weight: bold;
  }
  .btn-hesapla:hover { background: var(--brand-hover); }
  .btn-hesapla:disabled { background: var(--surface-3); color: var(--text-muted); cursor: not-allowed; }

  #map { flex: 1; background: var(--bg); }

  .sonuc-panel {
    display: none; background: var(--surface-2); padding: 15px; border-radius: var(--radius);
    margin-top: 15px; border: 1px solid var(--border);
  }
  .sonuc-panel.aktif { display: block; }
  .sonuc-baslik { color: var(--brand); font-size: 14px; font-weight: bold; margin-bottom: 10px; }
  .sonuc-ozet { display: flex; gap: 10px; margin-bottom: 12px; }
  .sonuc-kutu {
    flex: 1; text-align: center; background: var(--surface); border: 1px solid var(--border); padding: 8px; border-radius: var(--radius);
  }
  .sonuc-kutu .deger { font-size: 16px; font-weight: bold; color: var(--brand); }
  .sonuc-kutu .etiket { font-size: 10px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; }
  .sure-kirilim { font-size: 11px; color: var(--text-2); margin-bottom: 12px; text-align: center; }
  .sure-kirilim .bekleme-uyari { color: var(--brand); font-weight: bold; }
  .rota-listesi { font-size: 12px; line-height: 22px; }
  .rota-listesi .durak { padding: 3px 0; border-bottom: 1px solid var(--border); }
  .rota-listesi .saat { color: var(--brand); font-weight: bold; }

  .yukleniyor { display: none; text-align: center; padding: 20px; color: var(--text-2); }
  .yukleniyor.aktif { display: block; }

  .btn-maps {
    display: none; width: 100%; padding: 10px; margin-top: 10px; border: none;
    border-radius: var(--radius); background: #1a73e8; color: #fff; font-size: 13px;
    font-weight: bold; cursor: pointer; text-align: center;
  }
  .btn-maps.aktif { display: block; }
  .btn-maps:hover { background: #1557b0; }

  .filo-arac-btn {
    display: block; width: 100%; padding: 10px 12px; margin-bottom: 6px;
    background: var(--surface-2); border: 1.5px solid var(--border); border-radius: var(--radius);
    color: var(--text); text-align: left; cursor: pointer; font-size: 12px;
  }
  .filo-arac-btn:hover { border-color: var(--brand); }
  .filo-arac-btn.secili { border-color: var(--brand); background: var(--brand-bg); }
  .filo-arac-btn .fa-tip { color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .filo-arac-btn .fa-detay { color: var(--text-2); font-size: 10px; margin-top: 2px; }
  .filo-geocode-durum { font-size: 11px; color: var(--text-2); margin-bottom: 8px; }
</style>
</head>
<body>

<div id="splash">
  <img src="/static/logo.png" alt="Horoz Lojistik" class="splash-firma">
  <div class="splash-logo">TOROS</div>
  <div class="splash-alt">Teslimat Optimizasyonu</div>
</div>

<div class="ust-bar">
  <h1>TOROS</h1>
  <nav class="sekmeler">
    <a href="/" class="aktif">Rota Optimizasyonu</a>
    <a href="/filo">Filo Yönetimi</a>
    <a href="/plan">Haftalık Plan</a>
    <a href="/sofor">Şoför Yönetimi</a>
  </nav>
</div>

<div class="alt-govde">
<div class="panel">
  <h2>Depo Konumu</h2>
  <div class="depo-alan">
    <div class="form-grup">
      <label>Adres</label>
      <div class="adres-satir">
        <input type="text" id="depo-adres" placeholder="Bakırköy Meydanı, İstanbul">
        <button class="btn btn-ara" onclick="depoAdresiAra()">Ara</button>
      </div>
    </div>
    <div class="satir">
      <div class="form-grup"><label>Lat</label><input type="number" id="depo-lat" step="0.0001" value="40.9800"></div>
      <div class="form-grup"><label>Lon</label><input type="number" id="depo-lon" step="0.0001" value="28.8720"></div>
    </div>
    <div class="form-grup">
      <label>Kalkış Zamanı</label>
      <input type="datetime-local" id="kalkis-zamani">
    </div>
    <div class="form-grup" style="margin-top:8px;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="depoya-don" checked style="width:auto;accent-color:#c31f3f;">
        Depoya dönüş rotası ekle
      </label>
    </div>
    <div class="form-grup" id="evine-don-satir" style="margin-top:8px;display:none;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="evine-don" style="width:auto;accent-color:#0891b2;">
        Şoförün evine dönüş <span id="evine-don-ad" style="color:#0891b2;font-weight:600;"></span>
      </label>
    </div>
  </div>

  <div id="filo-alan" style="display:none;">
    <h2>Filo Araçları</h2>
    <div id="filo-arac-listesi" style="margin-bottom:10px;"></div>
  </div>

  <div id="teslimat-alani" style="display:none;">
  <h2>Teslimat Noktaları</h2>
  <div id="teslimat-listesi" class="teslimat-listesi"></div>
  <button class="btn btn-hesapla" id="btn-hesapla" onclick="hesapla()">Rota Hesapla</button>
  </div>

  <div class="yukleniyor" id="yukleniyor">Hesaplanıyor...</div>

  <div class="sonuc-panel" id="sonuc-panel">
    <div class="sonuc-baslik">Optimizasyon Sonucu</div>
    <div class="sonuc-ozet">
      <div class="sonuc-kutu">
        <div class="deger" id="s-mesafe">-</div>
        <div class="etiket">Mesafe</div>
      </div>
      <div class="sonuc-kutu">
        <div class="deger" id="s-sure">-</div>
        <div class="etiket">Toplam Süre</div>
      </div>
      <div class="sonuc-kutu">
        <div class="deger" id="s-teslimat">-</div>
        <div class="etiket">Teslimat</div>
      </div>
    </div>
    <div class="sure-kirilim" id="s-kirilim"></div>
    <div class="rota-listesi" id="rota-listesi"></div>
    <div class="maps-butonlar" id="maps-butonlar" style="display:none;gap:6px;margin-top:10px;">
      <button class="btn-maps aktif" style="display:block;flex:1;" onclick="googleMapsAc()">Google Maps'te Aç</button>
      <button class="btn-maps aktif" style="display:block;flex-shrink:0;width:auto;padding:10px 14px;background:#4b5563;" onclick="linkKopyala()">Linki Kopyala</button>
    </div>
  </div>
</div>

<div id="map"></div>
</div>

<script>
var map = L.map('map', {zoomSnap: 0.5, zoomDelta: 0.5, wheelDebounceTime: 40, wheelPxPerZoomLevel: 120}).setView([40.99, 28.84], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OSM &copy; CARTO', maxZoom: 19,
}).addTo(map);

setTimeout(function() { document.getElementById('splash').classList.add('kapan'); }, 900);

var markerlar = [];
var rotaCizgiler = [];
var sayac = 0;

// Esnaf acik rota (istemci tarafi cizim + ucretsiz Google Maps tarif linki)
var soforlar = {};             // sofor_id -> {ad, ev_lat, ev_lon}
var aktifEv = null;            // secili aracin soforunun evi {ad, lat, lon} | null
var evCizgi = null, evMarker = null;
var sonVeri = null, sonSonuc = null;
var evYolCache = {};           // "sonDurak>ev" -> yol polyline noktalari (road-following)
var evYolBekleyen = {};        // ayni bacak icin cift istek engeli

var now = new Date();
now.setMinutes(now.getMinutes() + 30);
var iso = now.toISOString().slice(0, 16);
document.getElementById('kalkis-zamani').value = iso;

// Ev konumu girilmis soforleri sofor_id ile sakla (arac secilince aranir)
fetch('/api/soforler')
  .then(function(r) { return r.json(); })
  .then(function(liste) {
    liste.forEach(function(s) {
      if (s.ev_lat != null && s.ev_lon != null) soforlar[s.id] = s;
    });
  });

// Depoya donus / eve donus tek bir "bitis" secimidir - biri isaretlenince digeri
// kalkar. Toggle SADECE cizimi + tarif linkini gunceller, tekrar hesaplamaz.
function bitisDegisti(kaynak) {
  var dep = document.getElementById('depoya-don');
  var ev = document.getElementById('evine-don');
  if (kaynak === 'ev' && ev.checked) dep.checked = false;
  if (kaynak === 'depo' && dep.checked) ev.checked = false;
  if (sonSonuc) { rotayiCiz(); linkVeListeGuncelle(); }
}
document.getElementById('depoya-don').addEventListener('change', function() { bitisDegisti('depo'); });
document.getElementById('evine-don').addEventListener('change', function() { bitisDegisti('ev'); });

function adresAra(inputEl, latEl, lonEl, isimEl) {
  var adres = inputEl.value;
  if (!adres) return;
  inputEl.style.borderColor = '#9ca3af';
  fetch('/geocode', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({adres: adres}),
  })
  .then(function(r) { return r.json(); })
  .then(function(v) {
    if (v.hata) { inputEl.style.borderColor = '#c31f3f'; return; }
    latEl.value = v.lat.toFixed(4);
    lonEl.value = v.lon.toFixed(4);
    if (isimEl && !isimEl.dataset.manual) isimEl.value = v.adres.split(',')[0];
    inputEl.style.borderColor = '#00e676';
  })
  .catch(function() { inputEl.style.borderColor = '#c31f3f'; });
}

function depoAdresiAra() {
  var inp = document.getElementById('depo-adres');
  var lat = document.getElementById('depo-lat');
  var lon = document.getElementById('depo-lon');
  adresAra(inp, lat, lon);
}

function teslimatEkle(isim, lat, lon) {
  sayac++;
  var id = sayac;
  var div = document.createElement('div');
  div.className = 'teslimat-karti';
  div.id = 'teslimat-' + id;
  div.innerHTML = ''
    + '<div class="form-grup" style="flex:0 0 auto;min-width:80px;"><label>İsim</label>'
    + '<input type="text" class="t-isim" value="' + (isim || 'Teslimat ' + id) + '" readonly></div>'
    + '<div class="form-grup" style="flex:1;"><label>Adres</label>'
    + '<input type="text" class="t-adres" placeholder="Adres" readonly></div>'
    + '<button class="sil-btn" onclick="teslimatSil(' + id + ')">&times;</button>'
    + '<input type="hidden" class="t-lat" value="' + (lat || '') + '">'
    + '<input type="hidden" class="t-lon" value="' + (lon || '') + '">'
    + '<input type="hidden" class="t-pencere-bas">'
    + '<input type="hidden" class="t-pencere-son">';
  document.getElementById('teslimat-listesi').appendChild(div);
}


function teslimatSil(id) {
  var el = document.getElementById('teslimat-' + id);
  if (el) el.remove();
}

function veriTopla() {
  var kartlar = document.querySelectorAll('.teslimat-karti');
  var teslimatlar = [];

  kartlar.forEach(function(k) {
    var lat = parseFloat(k.querySelector('.t-lat').value);
    var lon = parseFloat(k.querySelector('.t-lon').value);
    if (isNaN(lat) || isNaN(lon)) return;

    var t = {
      isim: k.querySelector('.t-isim').value,
      lat: lat,
      lon: lon,
    };

    var bas = k.querySelector('.t-pencere-bas').value;
    var son = k.querySelector('.t-pencere-son').value;
    if (bas && son) {
      t.pencere_bas = bas;
      t.pencere_son = son;
    }

    teslimatlar.push(t);
  });

  return {
    depo: {
      lat: parseFloat(document.getElementById('depo-lat').value),
      lon: parseFloat(document.getElementById('depo-lon').value),
    },
    kalkis_zamani: document.getElementById('kalkis-zamani').value,
    teslimatlar: teslimatlar,
    depoya_don: document.getElementById('depoya-don').checked,
  };
}

function hesapla() {
  var veri = veriTopla();
  if (veri.teslimatlar.length < 2) {
    alert('En az 2 teslimat noktası ekleyin.');
    return;
  }
  // Donus bacagini HER ZAMAN hesapla; checkbox'lar sadece gosterimi toggle'lar,
  // boylece depo/ev secimi tekrar ucretli API cagirmadan aninda degisir.
  veri.depoya_don = true;

  document.getElementById('btn-hesapla').disabled = true;
  document.getElementById('yukleniyor').classList.add('aktif');
  document.getElementById('sonuc-panel').classList.remove('aktif');

  fetch('/optimize', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(veri),
  })
  .then(function(r) { return r.json(); })
  .then(function(sonuc) {
    document.getElementById('yukleniyor').classList.remove('aktif');
    document.getElementById('btn-hesapla').disabled = false;

    if (sonuc.hata) {
      alert('Hata: ' + sonuc.hata);
      return;
    }

    haritaCiz(veri, sonuc);
    sonucGoster(sonuc);
  })
  .catch(function(err) {
    document.getElementById('yukleniyor').classList.remove('aktif');
    document.getElementById('btn-hesapla').disabled = false;
    alert('Hata: ' + err);
  });
}

function decodePolyline(encoded) {
  var points = [];
  var index = 0, lat = 0, lng = 0;
  while (index < encoded.length) {
    var b, shift = 0, result = 0;
    do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
    shift = 0; result = 0;
    do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
    points.push([lat / 1e5, lng / 1e5]);
  }
  return points;
}

function haritaCiz(veri, sonuc) {
  sonVeri = veri;
  sonSonuc = sonuc;
  rotayiCiz();
}

// Saklanan sonuca + bitis secimine (depo/ev) gore haritayi yeniden cizer.
// API cagrisi YOK - checkbox toggle'lari bunu cagirir.
function rotayiCiz() {
  if (!sonVeri || !sonSonuc) return;
  var veri = sonVeri, sonuc = sonSonuc;

  markerlar.forEach(function(m) { map.removeLayer(m); });
  markerlar = [];
  rotaCizgiler.forEach(function(c) { map.removeLayer(c); });
  rotaCizgiler = [];
  if (evCizgi) { map.removeLayer(evCizgi); evCizgi = null; }
  if (evMarker) { map.removeLayer(evMarker); evMarker = null; }

  var depoMarker = L.circleMarker([veri.depo.lat, veri.depo.lon], {
    radius: 8, fillColor: '#00a862', color: '#fff', weight: 2, fillOpacity: 1
  }).bindTooltip('Depo', {permanent: true, direction: 'top', offset: [0, -8], className: 'depo-tooltip'}).addTo(map);
  markerlar.push(depoMarker);

  sonuc.isimler.forEach(function(isim, i) {
    var idx = sonuc.optimal_sira[i];
    var t = veri.teslimatlar[idx];
    var varis = sonuc.varis_zamanlari[i];
    var marker = L.circleMarker([t.lat, t.lon], {
      radius: 6, fillColor: '#c31f3f', color: '#fff', weight: 1.5, fillOpacity: 1
    }).bindTooltip((i+1) + '. ' + isim + ' ' + varis, {direction: 'top', offset: [0, -6]}).addTo(map);
    markerlar.push(marker);
  });

  var depoyaDon = document.getElementById('depoya-don').checked;
  var evineDon = document.getElementById('evine-don').checked && aktifEv;
  var bounds = L.latLngBounds();

  // Son bacak = depoya donus (her zaman hesaplanir). Sadece depoya-don isikken ciz.
  var sonBacakIdx = sonuc.bacak_polylines.length - 1;
  sonuc.bacak_polylines.forEach(function(noktalar, i) {
    var donusBacagi = i === sonBacakIdx;
    if (donusBacagi && !depoyaDon) return;   // donus istenmiyorsa atla
    var cizgi = L.polyline(noktalar, {
      color: donusBacagi ? '#9333ea' : '#1a56db',
      weight: 5, opacity: 0.9,
      dashArray: donusBacagi ? '10, 8' : null,
    }).addTo(map);
    rotaCizgiler.push(cizgi);
    bounds.extend(cizgi.getBounds());
  });

  // Eve donus: son duraktan soforun evine YOLDAN giden cizgi + ev isareti.
  // Yol henuz gelmediyse gecici duz (kus ucusu) kesikli cizgi, gelince yol cizilir.
  if (evineDon) {
    var sonIdx = sonuc.optimal_sira[sonuc.optimal_sira.length - 1];
    var sonDurak = veri.teslimatlar[sonIdx];
    var ev = { lat: aktifEv.lat, lon: aktifEv.lon };
    var anahtar = evYolAnahtar(sonDurak, ev);
    var yol = evYolCache[anahtar];
    var noktalar = yol || [[sonDurak.lat, sonDurak.lon], [ev.lat, ev.lon]];
    evCizgi = L.polyline(noktalar, {
      color: '#0891b2', weight: 4, opacity: 0.9, dashArray: yol ? null : '4, 8',
    }).addTo(map);
    evMarker = L.circleMarker([ev.lat, ev.lon], {
      radius: 7, fillColor: '#0891b2', color: '#fff', weight: 2, fillOpacity: 1,
    }).bindTooltip(aktifEv.ad + ' — ev', {permanent: true, direction: 'top', offset: [0, -8]}).addTo(map);
    bounds.extend(evCizgi.getBounds());
    if (!yol) evYoluGetir(sonDurak, ev, anahtar);   // yolu cek, gelince yeniden ciz
  }

  if (bounds.isValid()) map.fitBounds(bounds, {padding: [40, 40]});
}

function evYolAnahtar(a, b) {
  return a.lat.toFixed(5) + ',' + a.lon.toFixed(5) + '>' + b.lat.toFixed(5) + ',' + b.lon.toFixed(5);
}

// Son duraktan eve gercek yolu (Directions) ceker, onbellege alir, sonra yeniden
// cizer. Onbellek + bekleyen guard sayesinde ayni bacak icin tek ucretli istek olur.
function evYoluGetir(sonDurak, ev, anahtar) {
  if (evYolBekleyen[anahtar]) return;
  evYolBekleyen[anahtar] = true;
  fetch('/api/yol', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: [sonDurak.lat, sonDurak.lon], to: [ev.lat, ev.lon] })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    evYolBekleyen[anahtar] = false;
    if (d && d.polyline) {
      evYolCache[anahtar] = decodePolyline(d.polyline);
      if (document.getElementById('evine-don').checked) rotayiCiz();
    }
  })
  .catch(function() { evYolBekleyen[anahtar] = false; });
}

function sureBicimle(dk) {
  if (dk < 60) return dk + ' dk';
  var s = Math.floor(dk / 60), k = dk % 60;
  return k ? s + ' sa ' + k + ' dk' : s + ' sa';
}

function sonucGoster(sonuc) {
  document.getElementById('s-mesafe').textContent = sonuc.toplam_mesafe;

  // Yol / servis / bekleme ayri ayri tutulur; ozette toplami, altinda kirilimi gosteriyoruz.
  var yolDk = Math.round(parseInt(sonuc.toplam_trafik, 10) || 0);
  var servisDk = Math.round((sonuc.toplam_servis_sn || 0) / 60);
  var beklemeDk = Math.round((sonuc.toplam_bekleme_sn || 0) / 60);
  document.getElementById('s-sure').textContent = sureBicimle(yolDk + servisDk + beklemeDk);

  var kirilim = 'yol ' + sureBicimle(yolDk) + ' · servis ' + sureBicimle(servisDk);
  if (beklemeDk > 0) {
    kirilim += ' · <span class="bekleme-uyari">randevu beklemesi ' + sureBicimle(beklemeDk) + '</span>';
  }
  document.getElementById('s-kirilim').innerHTML = kirilim;
  document.getElementById('s-teslimat').textContent = sonuc.isimler.length;

  linkVeListeGuncelle();
}

// Rota listesi + Google Maps tarif linkini bitis secimine gore kurar.
// Bitis onceligi: sofor evi > depo donusu > son teslimat. Eve donus SECILIYSE
// ev, tarif linkinde son varis noktasidir -> surucu telefonda yoldan tarif alir.
function linkVeListeGuncelle() {
  if (!sonVeri || !sonSonuc) return;
  var veri = sonVeri, sonuc = sonSonuc;
  var depoyaDon = document.getElementById('depoya-don').checked;
  var evineDon = document.getElementById('evine-don').checked && aktifEv;

  var html = '<div class="durak"><b>0.</b> Depo (kalkış)</div>';
  sonuc.isimler.forEach(function(isim, i) {
    var varis = sonuc.varis_zamanlari[i];
    html += '<div class="durak"><b>' + (i+1) + '.</b> ' + isim + ' <span class="saat">' + varis + '</span> <span style="color:#76b5c5;font-size:11px;">(+15dk teslimat)</span></div>';
  });
  if (evineDon) {
    html += '<div class="durak"><b>' + (sonuc.isimler.length + 1) + '.</b> ' + aktifEv.ad
          + ' — ev <span style="color:#0891b2;font-size:11px;">(şoför evi)</span></div>';
  } else if (depoyaDon) {
    var donus = sonuc.varis_zamanlari[sonuc.varis_zamanlari.length - 1];
    html += '<div class="durak"><b>' + (sonuc.isimler.length + 1) + '.</b> Depo (dönüş) <span class="saat">' + donus + '</span></div>';
  }
  document.getElementById('rota-listesi').innerHTML = html;
  document.getElementById('sonuc-panel').classList.add('aktif');

  var depoStr = veri.depo.lat + ',' + veri.depo.lon;
  var waypoints = sonuc.optimal_sira.map(function(idx) {
    var t = veri.teslimatlar[idx];
    return t.lat + ',' + t.lon;
  });
  var origin = depoStr, destination, wp;
  if (evineDon) {
    destination = aktifEv.lat + ',' + aktifEv.lon;   // ev = son varis noktasi
    wp = waypoints;
  } else if (depoyaDon) {
    destination = depoStr;
    wp = waypoints;
  } else {
    destination = waypoints[waypoints.length - 1];
    wp = waypoints.slice(0, -1);
  }
  var mapsUrl = 'https://www.google.com/maps/dir/' + origin + '/' + wp.join('/') + '/' + destination;
  window._mapsUrl = mapsUrl;
  document.getElementById('maps-butonlar').style.display = 'flex';
}

function googleMapsAc() {
  if (window._mapsUrl) window.open(window._mapsUrl, '_blank');
}

function linkKopyala() {
  if (!window._mapsUrl) return;
  navigator.clipboard.writeText(window._mapsUrl).then(function() {
    var btn = document.querySelector('.maps-butonlar button:last-child');
    btn.textContent = 'Kopyalandı!';
    setTimeout(function() { btn.textContent = 'Linki Kopyala'; }, 2000);
  });
}

var seciliArac = null;

var filoVerisi = null;

function filoyuYukle() {
  Promise.all([
    fetch('/api/araclar').then(function(r) { return r.json(); }),
    fetch('/api/teslimatlar').then(function(r) { return r.json(); })
  ]).then(function(sonuclar) {
    var aracListesi = sonuclar[0];
    var teslimatListesi = sonuclar[1];

    if (aracListesi.length === 0) {
      document.getElementById('filo-alan').style.display = 'block';
      document.getElementById('filo-arac-listesi').innerHTML =
        '<p style="color:#6b7280;text-align:center;padding:20px 0;">Henüz araç eklenmemiş. <a href="/filo" style="color:#c31f3f;">Filo sayfasından</a> araç ve teslimat ekleyin.</p>';
      return;
    }

    filoVerisi = { araclar: {}, teslimatlar: {} };
    teslimatListesi.forEach(function(t) {
      filoVerisi.teslimatlar[t.id] = {
        adi: t.adi, adres: t.adres, lat: t.lat, lon: t.lon,
        ag: t.agirlik, hc: t.hacim,
        termin: t.termin_tarihi, randevuBas: t.randevu_bas, randevuSon: t.randevu_son,
        arac_id: t.arac_id
      };
    });

    aracListesi.forEach(function(a) {
      var teslimatlari = [];
      teslimatListesi.forEach(function(t) {
        if (t.arac_id === a.id) teslimatlari.push(t.id);
      });
      filoVerisi.araclar[a.id] = {
        adi: a.adi, tip: a.tip, maxAg: a.max_agirlik, maxHc: a.max_hacim,
        teslimatlar: teslimatlari, soforId: a.sofor_id
      };
    });

    document.getElementById('filo-alan').style.display = 'block';
    var liste = document.getElementById('filo-arac-listesi');
    liste.innerHTML = '';

    Object.keys(filoVerisi.araclar).forEach(function(id) {
      var a = filoVerisi.araclar[id];
      var tesCount = a.teslimatlar.length;
      var btn = document.createElement('button');
      btn.className = 'filo-arac-btn';
      btn.id = 'filo-btn-' + id;
      btn.innerHTML = '<b>' + a.adi + '</b> <span class="fa-tip">' + a.tip + '</span>'
        + '<div class="fa-detay">' + tesCount + ' teslimat | ' + a.maxAg + 'kg | ' + a.maxHc + 'm3</div>';
      btn.onclick = function() { aracSec(parseInt(id)); };
      liste.appendChild(btn);
    });
  });
}

function aracSec(aracId) {
  var arac = filoVerisi.araclar[aracId];
  if (!arac || arac.teslimatlar.length === 0) {
    alert('Bu araçta teslimat yok.');
    return;
  }

  document.querySelectorAll('.filo-arac-btn').forEach(function(b) { b.classList.remove('secili'); });
  document.getElementById('filo-btn-' + aracId).classList.add('secili');
  seciliArac = aracId;

  // Secili aracin soforunun evi varsa "eve donus" secenegini goster, yoksa gizle
  aktifEv = null;
  var sofor = arac.soforId ? soforlar[arac.soforId] : null;
  if (sofor) {
    aktifEv = { ad: sofor.ad, lat: sofor.ev_lat, lon: sofor.ev_lon };
    document.getElementById('evine-don-ad').textContent = '— ' + sofor.ad;
    document.getElementById('evine-don-satir').style.display = 'block';
  } else {
    document.getElementById('evine-don').checked = false;
    document.getElementById('evine-don-satir').style.display = 'none';
  }

  document.getElementById('teslimat-alani').style.display = 'block';
  document.getElementById('teslimat-listesi').innerHTML = '';
  sayac = 0;

  // onceki hesap sonucu gecersiz; toggle'lar bayat veri cizmesin
  sonVeri = null;
  sonSonuc = null;
  markerlar.forEach(function(m) { map.removeLayer(m); });
  markerlar = [];
  rotaCizgiler.forEach(function(c) { map.removeLayer(c); });
  rotaCizgiler = [];
  if (evCizgi) { map.removeLayer(evCizgi); evCizgi = null; }
  if (evMarker) { map.removeLayer(evMarker); evMarker = null; }
  document.getElementById('sonuc-panel').classList.remove('aktif');
  document.getElementById('maps-butonlar').style.display = 'none';

  var depoLat = parseFloat(document.getElementById('depo-lat').value);
  var depoLon = parseFloat(document.getElementById('depo-lon').value);
  var depoMarker = L.circleMarker([depoLat, depoLon], {
    radius: 8, fillColor: '#00a862', color: '#fff', weight: 2, fillOpacity: 1
  }).bindTooltip('Depo', {permanent: true, direction: 'top', offset: [0, -8], className: 'depo-tooltip'}).addTo(map);
  markerlar.push(depoMarker);

  arac.teslimatlar.forEach(function(tid) {
    var t = filoVerisi.teslimatlar[tid];
    if (!t) return;

    teslimatEkle(t.adi, '', '');
    var kart = document.getElementById('teslimat-' + sayac);

    if (t.lat && t.lon) {
      kart.querySelector('.t-adres').value = t.adres || '';
      kart.querySelector('.t-lat').value = t.lat.toFixed(4);
      kart.querySelector('.t-lon').value = t.lon.toFixed(4);
      kart.querySelector('.t-adres').style.borderColor = '#00e676';

      var marker = L.circleMarker([t.lat, t.lon], {
        radius: 6, fillColor: '#c31f3f', color: '#fff', weight: 1.5, fillOpacity: 1
      }).bindTooltip(t.adi, {direction: 'top', offset: [0, -6]}).addTo(map);
      markerlar.push(marker);
    }

    // Randevu penceresi rotanin gununde gecerlidir; termin bir son tarihtir,
    // pencereye tarih olarak verilirse arac haftalarca "bekliyor" sayilir.
    if (t.randevuBas && t.randevuSon) {
      var rotaGunu = (document.getElementById('kalkis-zamani').value || '').slice(0, 10);
      if (rotaGunu) {
        kart.querySelector('.t-pencere-bas').value = rotaGunu + 'T' + t.randevuBas;
        kart.querySelector('.t-pencere-son').value = rotaGunu + 'T' + t.randevuSon;
      }
    }
  });

  if (markerlar.length > 1) {
    var bounds = L.latLngBounds(markerlar.map(function(m) { return m.getLatLng(); }));
    map.fitBounds(bounds, {padding: [40, 40]});
  }
}

filoyuYukle();
</script>
</body>
