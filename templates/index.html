<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TOROS - Teslimat Optimizasyonu</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; display: flex; height: 100vh; }

  .panel {
    width: 400px; background: #16213e; overflow-y: auto; padding: 20px;
    border-right: 2px solid #0f3460; flex-shrink: 0;
  }
  .panel h1 { font-size: 20px; color: #e94560; margin-bottom: 15px; }
  .panel h2 { font-size: 14px; color: #a0a0b0; margin: 15px 0 8px; }

  .form-grup { margin-bottom: 10px; }
  .form-grup label { display: block; font-size: 12px; color: #a0a0b0; margin-bottom: 3px; }
  .form-grup input, .form-grup select {
    width: 100%; padding: 8px; background: #0f3460; border: 1px solid #1a3a6e;
    color: #eee; border-radius: 4px; font-size: 13px;
  }
  .form-grup input:focus { outline: none; border-color: #e94560; }

  .depo-alan { background: #0f3460; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
  .depo-alan .form-grup { margin-bottom: 6px; }

  .teslimat-listesi { margin-bottom: 15px; }
  .teslimat-karti {
    background: #0f3460; padding: 10px; border-radius: 6px; margin-bottom: 8px;
    position: relative;
  }
  .teslimat-karti .sil-btn {
    position: absolute; top: 6px; right: 8px; background: none; border: none;
    color: #e94560; cursor: pointer; font-size: 16px;
  }
  .teslimat-karti .satir { display: flex; gap: 6px; margin-bottom: 4px; }
  .teslimat-karti .satir input { flex: 1; }

  .btn {
    padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: bold;
  }
  .btn-ekle { background: #0f3460; color: #76b5c5; width: 100%; margin-bottom: 10px; }
  .btn-ekle:hover { background: #1a4a7e; }
  .btn-ara {
    background: #1a4a7e; color: #76b5c5; border: none; padding: 8px 12px;
    border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .btn-ara:hover { background: #2a5a8e; }
  .adres-satir { display: flex; gap: 6px; }
  .adres-satir input { flex: 1; }
  .satir { display: flex; gap: 6px; }
  .btn-hesapla { background: #e94560; color: #fff; width: 100%; font-size: 15px; padding: 12px; }
  .btn-hesapla:hover { background: #c73652; }
  .btn-hesapla:disabled { background: #555; cursor: not-allowed; }

  #map { flex: 1; }

  .sonuc-panel {
    display: none; background: #0d1b36; padding: 15px; border-radius: 6px;
    margin-top: 15px; border: 1px solid #0f3460;
  }
  .sonuc-panel.aktif { display: block; }
  .sonuc-baslik { color: #e94560; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
  .sonuc-ozet { display: flex; gap: 10px; margin-bottom: 12px; }
  .sonuc-kutu {
    flex: 1; text-align: center; background: #0f3460; padding: 8px; border-radius: 4px;
  }
  .sonuc-kutu .deger { font-size: 16px; font-weight: bold; color: #e94560; }
  .sonuc-kutu .etiket { font-size: 10px; color: #a0a0b0; }
  .rota-listesi { font-size: 12px; line-height: 22px; }
  .rota-listesi .durak { padding: 3px 0; border-bottom: 1px solid #1a3a6e; }
  .rota-listesi .saat { color: #76b5c5; font-weight: bold; }

  .yukleniyor {
    display: none; text-align: center; padding: 20px; color: #76b5c5;
  }
  .yukleniyor.aktif { display: block; }

  .btn-maps {
    display: none; width: 100%; padding: 10px; margin-top: 10px; border: none;
    border-radius: 6px; background: #1a73e8; color: #fff; font-size: 13px;
    font-weight: bold; cursor: pointer; text-align: center;
  }
  .btn-maps.aktif { display: block; }
  .btn-maps:hover { background: #1557b0; }

  .filo-arac-btn {
    display: block; width: 100%; padding: 10px 12px; margin-bottom: 6px;
    background: #0f3460; border: 2px solid #1a3a6e; border-radius: 6px;
    color: #eee; text-align: left; cursor: pointer; font-size: 12px;
  }
  .filo-arac-btn:hover { border-color: #76b5c5; }
  .filo-arac-btn.secili { border-color: #e94560; background: #1a2a50; }
  .filo-arac-btn .fa-tip { color: #76b5c5; font-size: 10px; }
  .filo-arac-btn .fa-detay { color: #a0a0b0; font-size: 10px; margin-top: 2px; }
  .filo-geocode-durum { font-size: 11px; color: #76b5c5; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="panel">
  <h1>TOROS</h1>
  <a href="/filo" style="color:#76b5c5;font-size:12px;text-decoration:none;display:block;margin-bottom:10px;">Filo Yonetimi &rarr;</a>

  <div id="filo-alan" style="display:none;">
    <h2>Filo Araclari</h2>
    <div id="filo-arac-listesi" style="margin-bottom:10px;"></div>
  </div>

  <h2>Depo Konumu</h2>
  <div class="depo-alan">
    <div class="form-grup">
      <label>Adres</label>
      <div class="adres-satir">
        <input type="text" id="depo-adres" placeholder="Bakirkoy Meydani, Istanbul">
        <button class="btn btn-ara" onclick="depoAdresiAra()">Ara</button>
      </div>
    </div>
    <div class="satir">
      <div class="form-grup"><label>Lat</label><input type="number" id="depo-lat" step="0.0001" value="40.9800"></div>
      <div class="form-grup"><label>Lon</label><input type="number" id="depo-lon" step="0.0001" value="28.8720"></div>
    </div>
    <div class="form-grup">
      <label>Kalkis Zamani</label>
      <input type="datetime-local" id="kalkis-zamani">
    </div>
    <div class="form-grup" style="margin-top:8px;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="depoya-don" checked style="width:auto;accent-color:#e94560;">
        Depoya donus rotasi ekle
      </label>
    </div>
  </div>

  <div id="teslimat-alani" style="display:none;">
  <h2>Teslimat Noktalari</h2>
  <div id="teslimat-listesi" class="teslimat-listesi"></div>
  <button class="btn btn-ekle" onclick="teslimatEkle()">+ Teslimat Ekle</button>
  <button class="btn btn-hesapla" id="btn-hesapla" onclick="hesapla()">Rota Hesapla</button>
  </div>

  <div class="yukleniyor" id="yukleniyor">Hesaplaniyor...</div>

  <div class="sonuc-panel" id="sonuc-panel">
    <div class="sonuc-baslik">Optimizasyon Sonucu</div>
    <div class="sonuc-ozet">
      <div class="sonuc-kutu">
        <div class="deger" id="s-mesafe">-</div>
        <div class="etiket">Mesafe</div>
      </div>
      <div class="sonuc-kutu">
        <div class="deger" id="s-sure">-</div>
        <div class="etiket">Toplam Sure</div>
      </div>
      <div class="sonuc-kutu">
        <div class="deger" id="s-teslimat">-</div>
        <div class="etiket">Teslimat</div>
      </div>
    </div>
    <div class="rota-listesi" id="rota-listesi"></div>
    <div class="maps-butonlar" id="maps-butonlar" style="display:none;gap:6px;margin-top:10px;">
      <button class="btn-maps aktif" style="display:block;flex:1;" onclick="googleMapsAc()">Google Maps'te Ac</button>
      <button class="btn-maps aktif" style="display:block;flex-shrink:0;width:auto;padding:10px 14px;background:#0f3460;" onclick="linkKopyala()">Linki Kopyala</button>
    </div>
  </div>
</div>

<div id="map"></div>

<script>
var map = L.map('map').setView([40.99, 28.84], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OSM &copy; CARTO', maxZoom: 19,
}).addTo(map);

var markerlar = [];
var rotaCizgiler = [];
var sayac = 0;

var now = new Date();
now.setMinutes(now.getMinutes() + 30);
var iso = now.toISOString().slice(0, 16);
document.getElementById('kalkis-zamani').value = iso;

function adresAra(inputEl, latEl, lonEl, isimEl) {
  var adres = inputEl.value;
  if (!adres) return;
  inputEl.style.borderColor = '#76b5c5';
  fetch('/geocode', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({adres: adres}),
  })
  .then(function(r) { return r.json(); })
  .then(function(v) {
    if (v.hata) { inputEl.style.borderColor = '#e94560'; return; }
    latEl.value = v.lat.toFixed(4);
    lonEl.value = v.lon.toFixed(4);
    if (isimEl && !isimEl.dataset.manual) isimEl.value = v.adres.split(',')[0];
    inputEl.style.borderColor = '#00e676';
  })
  .catch(function() { inputEl.style.borderColor = '#e94560'; });
}

function depoAdresiAra() {
  var inp = document.getElementById('depo-adres');
  var lat = document.getElementById('depo-lat');
  var lon = document.getElementById('depo-lon');
  adresAra(inp, lat, lon);
}

function teslimatEkle(isim, lat, lon) {
  sayac++;
  var id = sayac;
  var div = document.createElement('div');
  div.className = 'teslimat-karti';
  div.id = 'teslimat-' + id;
  div.innerHTML = ''
    + '<button class="sil-btn" onclick="teslimatSil(' + id + ')">&times;</button>'
    + '<div class="form-grup"><label>Adres</label>'
    + '<div class="adres-satir"><input type="text" class="t-adres" placeholder="Adres girin...">'
    + '<button class="btn btn-ara" onclick="teslimatAdresiAra(' + id + ')">Ara</button></div></div>'
    + '<div class="form-grup"><label>Isim</label>'
    + '<input type="text" class="t-isim" value="' + (isim || 'Teslimat ' + id) + '"></div>'
    + '<div class="satir">'
    + '<div class="form-grup"><label>Lat</label><input type="number" class="t-lat" step="0.0001" value="' + (lat || '') + '"></div>'
    + '<div class="form-grup"><label>Lon</label><input type="number" class="t-lon" step="0.0001" value="' + (lon || '') + '"></div>'
    + '</div>'
    + '<input type="hidden" class="t-pencere-bas">'
    + '<input type="hidden" class="t-pencere-son">';
  document.getElementById('teslimat-listesi').appendChild(div);
}

function teslimatAdresiAra(id) {
  var kart = document.getElementById('teslimat-' + id);
  var inp = kart.querySelector('.t-adres');
  var lat = kart.querySelector('.t-lat');
  var lon = kart.querySelector('.t-lon');
  var isim = kart.querySelector('.t-isim');
  adresAra(inp, lat, lon, isim);
}

function teslimatSil(id) {
  var el = document.getElementById('teslimat-' + id);
  if (el) el.remove();
}

function veriTopla() {
  var kartlar = document.querySelectorAll('.teslimat-karti');
  var teslimatlar = [];

  kartlar.forEach(function(k) {
    var lat = parseFloat(k.querySelector('.t-lat').value);
    var lon = parseFloat(k.querySelector('.t-lon').value);
    if (isNaN(lat) || isNaN(lon)) return;

    var t = {
      isim: k.querySelector('.t-isim').value,
      lat: lat,
      lon: lon,
    };

    var bas = k.querySelector('.t-pencere-bas').value;
    var son = k.querySelector('.t-pencere-son').value;
    if (bas && son) {
      t.pencere_bas = bas;
      t.pencere_son = son;
    }

    teslimatlar.push(t);
  });

  return {
    depo: {
      lat: parseFloat(document.getElementById('depo-lat').value),
      lon: parseFloat(document.getElementById('depo-lon').value),
    },
    kalkis_zamani: document.getElementById('kalkis-zamani').value,
    teslimatlar: teslimatlar,
    depoya_don: document.getElementById('depoya-don').checked,
  };
}

function hesapla() {
  var veri = veriTopla();
  if (veri.teslimatlar.length < 2) {
    alert('En az 2 teslimat noktasi ekleyin.');
    return;
  }

  document.getElementById('btn-hesapla').disabled = true;
  document.getElementById('yukleniyor').classList.add('aktif');
  document.getElementById('sonuc-panel').classList.remove('aktif');

  fetch('/optimize', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(veri),
  })
  .then(function(r) { return r.json(); })
  .then(function(sonuc) {
    document.getElementById('yukleniyor').classList.remove('aktif');
    document.getElementById('btn-hesapla').disabled = false;

    if (sonuc.hata) {
      alert('Hata: ' + sonuc.hata);
      return;
    }

    haritaCiz(veri, sonuc);
    sonucGoster(sonuc);
  })
  .catch(function(err) {
    document.getElementById('yukleniyor').classList.remove('aktif');
    document.getElementById('btn-hesapla').disabled = false;
    alert('Hata: ' + err);
  });
}

function decodePolyline(encoded) {
  var points = [];
  var index = 0, lat = 0, lng = 0;
  while (index < encoded.length) {
    var b, shift = 0, result = 0;
    do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
    shift = 0; result = 0;
    do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
    points.push([lat / 1e5, lng / 1e5]);
  }
  return points;
}

function haritaCiz(veri, sonuc) {
  markerlar.forEach(function(m) { map.removeLayer(m); });
  markerlar = [];
  rotaCizgiler.forEach(function(c) { map.removeLayer(c); });
  rotaCizgiler = [];

  var depoMarker = L.marker([veri.depo.lat, veri.depo.lon], {
    icon: L.divIcon({
      html: '<div style="background:#00e676;color:#fff;padding:4px 8px;border-radius:12px;font-weight:bold;font-size:11px;white-space:nowrap;">Depo</div>',
      className: '',
    })
  }).addTo(map);
  markerlar.push(depoMarker);

  sonuc.isimler.forEach(function(isim, i) {
    var idx = sonuc.optimal_sira[i];
    var t = veri.teslimatlar[idx];
    var varis = sonuc.varis_zamanlari[i];
    var marker = L.marker([t.lat, t.lon], {
      icon: L.divIcon({
        html: '<div style="background:#e94560;color:#fff;padding:3px 7px;border-radius:10px;font-size:11px;white-space:nowrap;">' + (i+1) + '. ' + isim + ' <span style="color:#ffcdd2">' + varis + '</span></div>',
        className: '',
      })
    }).addTo(map);
    markerlar.push(marker);
  });

  var depoyaDon = document.getElementById('depoya-don').checked;
  var bounds = L.latLngBounds();

  sonuc.bacak_polylines.forEach(function(noktalar, i) {
    var sonBacak = depoyaDon && i === sonuc.bacak_polylines.length - 1;
    var cizgi = L.polyline(noktalar, {
      color: sonBacak ? '#ab47bc' : '#00b0ff',
      weight: 5,
      opacity: 0.9,
      dashArray: sonBacak ? '10, 8' : null,
    }).addTo(map);
    rotaCizgiler.push(cizgi);
    bounds.extend(cizgi.getBounds());
  });

  map.fitBounds(bounds, {padding: [40, 40]});
}

function sonucGoster(sonuc) {
  document.getElementById('s-mesafe').textContent = sonuc.toplam_mesafe;
  var teslimatDkToplam = sonuc.isimler.length * 15;
  document.getElementById('s-sure').textContent = sonuc.toplam_trafik + ' + ' + teslimatDkToplam + 'dk';
  document.getElementById('s-teslimat').textContent = sonuc.isimler.length;

  var depoyaDon = document.getElementById('depoya-don').checked;
  var html = '<div class="durak"><b>0.</b> Depo (kalkis)</div>';
  sonuc.isimler.forEach(function(isim, i) {
    var varis = sonuc.varis_zamanlari[i];
    html += '<div class="durak"><b>' + (i+1) + '.</b> ' + isim + ' <span class="saat">' + varis + '</span> <span style="color:#76b5c5;font-size:11px;">(+15dk teslimat)</span></div>';
  });
  if (depoyaDon) {
    var donus = sonuc.varis_zamanlari[sonuc.varis_zamanlari.length - 1];
    html += '<div class="durak"><b>' + (sonuc.isimler.length + 1) + '.</b> Depo (donus) <span class="saat">' + donus + '</span></div>';
  }

  document.getElementById('rota-listesi').innerHTML = html;
  document.getElementById('sonuc-panel').classList.add('aktif');

  var veri = veriTopla();
  var depoStr = veri.depo.lat + ',' + veri.depo.lon;
  var waypoints = sonuc.optimal_sira.map(function(idx) {
    var t = veri.teslimatlar[idx];
    return t.lat + ',' + t.lon;
  });

  var origin = depoStr;
  var destination = depoyaDon ? depoStr : waypoints[waypoints.length - 1];
  var wp = depoyaDon ? waypoints : waypoints.slice(0, -1);

  var mapsUrl = 'https://www.google.com/maps/dir/' + origin + '/' + wp.join('/') + '/' + destination;
  window._mapsUrl = mapsUrl;
  document.getElementById('maps-butonlar').style.display = 'flex';
}

function googleMapsAc() {
  if (window._mapsUrl) window.open(window._mapsUrl, '_blank');
}

function linkKopyala() {
  if (!window._mapsUrl) return;
  navigator.clipboard.writeText(window._mapsUrl).then(function() {
    var btn = document.querySelector('.maps-butonlar button:last-child');
    btn.textContent = 'Kopyalandi!';
    setTimeout(function() { btn.textContent = 'Linki Kopyala'; }, 2000);
  });
}

var seciliArac = null;

function filoyuYukle() {
  var raw = localStorage.getItem('toros_filo');
  if (!raw) return;
  var filo = JSON.parse(raw);
  var aracIds = Object.keys(filo.araclar);
  if (aracIds.length === 0) return;

  document.getElementById('filo-alan').style.display = 'block';
  var liste = document.getElementById('filo-arac-listesi');
  liste.innerHTML = '';

  aracIds.forEach(function(id) {
    var a = filo.araclar[id];
    var tesCount = a.teslimatlar.length;
    var btn = document.createElement('button');
    btn.className = 'filo-arac-btn';
    btn.id = 'filo-btn-' + id;
    btn.innerHTML = '<b>' + a.adi + '</b> <span class="fa-tip">' + a.tip + '</span>'
      + '<div class="fa-detay">' + tesCount + ' teslimat | ' + a.maxAg + 'kg | ' + a.maxHc + 'm3</div>';
    btn.onclick = function() { aracSec(id, filo); };
    liste.appendChild(btn);
  });
}

function aracSec(aracId, filo) {
  var arac = filo.araclar[aracId];
  if (!arac || arac.teslimatlar.length === 0) {
    alert('Bu aracta teslimat yok.');
    return;
  }

  document.querySelectorAll('.filo-arac-btn').forEach(function(b) { b.classList.remove('secili'); });
  document.getElementById('filo-btn-' + aracId).classList.add('secili');
  seciliArac = aracId;

  document.getElementById('teslimat-alani').style.display = 'block';
  document.getElementById('teslimat-listesi').innerHTML = '';
  sayac = 0;

  markerlar.forEach(function(m) { map.removeLayer(m); });
  markerlar = [];
  rotaCizgiler.forEach(function(c) { map.removeLayer(c); });
  rotaCizgiler = [];
  document.getElementById('sonuc-panel').classList.remove('aktif');
  document.getElementById('maps-butonlar').style.display = 'none';

  var tesIds = arac.teslimatlar;
  var bekleyen = tesIds.length;
  var geocodeBiten = 0;

  var depoLat = parseFloat(document.getElementById('depo-lat').value);
  var depoLon = parseFloat(document.getElementById('depo-lon').value);
  var depoMarker = L.marker([depoLat, depoLon], {
    icon: L.divIcon({
      html: '<div style="background:#00e676;color:#fff;padding:4px 8px;border-radius:12px;font-weight:bold;font-size:11px;white-space:nowrap;">Depo</div>',
      className: '',
    })
  }).addTo(map);
  markerlar.push(depoMarker);

  tesIds.forEach(function(tid) {
    var t = filo.teslimatlar[tid];
    if (!t) { bekleyen--; return; }

    var randevuStr = '';
    if (t.randevu) randevuStr = t.randevu;

    teslimatEkle(t.adi, '', '');
    var kart = document.getElementById('teslimat-' + sayac);
    var kartId = sayac;

    if (t.lat && t.lon) {
      kart.querySelector('.t-adres').value = t.adres || '';
      kart.querySelector('.t-lat').value = t.lat.toFixed(4);
      kart.querySelector('.t-lon').value = t.lon.toFixed(4);
      kart.querySelector('.t-adres').style.borderColor = '#00e676';

      var marker = L.marker([t.lat, t.lon], {
        icon: L.divIcon({
          html: '<div style="background:#e94560;color:#fff;padding:3px 7px;border-radius:10px;font-size:11px;white-space:nowrap;">' + t.adi + '</div>',
          className: '',
        })
      }).addTo(map);
      markerlar.push(marker);

      geocodeBiten++;
      if (geocodeBiten === bekleyen) {
        var bounds = L.latLngBounds(markerlar.map(function(m) { return m.getLatLng(); }));
        map.fitBounds(bounds, {padding: [40, 40]});
      }
    } else if (t.adres) {
      kart.querySelector('.t-adres').value = t.adres;

      fetch('/geocode', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({adres: t.adres}),
      })
      .then(function(r) { return r.json(); })
      .then(function(v) {
        if (!v.hata) {
          var k = document.getElementById('teslimat-' + kartId);
          if (k) {
            k.querySelector('.t-lat').value = v.lat.toFixed(4);
            k.querySelector('.t-lon').value = v.lon.toFixed(4);
            k.querySelector('.t-adres').style.borderColor = '#00e676';
          }
          var marker = L.marker([v.lat, v.lon], {
            icon: L.divIcon({
              html: '<div style="background:#e94560;color:#fff;padding:3px 7px;border-radius:10px;font-size:11px;white-space:nowrap;">' + t.adi + '</div>',
              className: '',
            })
          }).addTo(map);
          markerlar.push(marker);
        }
        geocodeBiten++;
        if (geocodeBiten === bekleyen) {
          var bounds = L.latLngBounds(markerlar.map(function(m) { return m.getLatLng(); }));
          map.fitBounds(bounds, {padding: [40, 40]});
        }
      })
      .catch(function() { geocodeBiten++; });
    } else {
      bekleyen--;
    }

    if (t.randevuBas && t.randevuSon && t.termin) {
      kart.querySelector('.t-pencere-bas').value = t.termin + 'T' + t.randevuBas;
      kart.querySelector('.t-pencere-son').value = t.termin + 'T' + t.randevuSon;
    }
  });
}

filoyuYukle();

if (!localStorage.getItem('toros_filo')) {
  document.getElementById('teslimat-alani').style.display = 'block';
  teslimatEkle('Teslimat 1', '', '');
  teslimatEkle('Teslimat 2', '', '');
}
</script>
