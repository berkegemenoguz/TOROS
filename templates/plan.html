<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>TOROS - Haftalık Plan</title>
<link rel="stylesheet" href="/static/toros.css">
<style>
  .icerik { padding: 18px 22px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .plan-baslik { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .tarih-araligi { font-size: 13px; color: var(--text-2); }
  .sigmadi-rozet {
    margin-left: auto; font-size: 12px; background: var(--uyari-bg); color: var(--uyari-text);
    padding: 5px 12px; border-radius: var(--radius); font-weight: 600; cursor: pointer;
  }
  .gun-sec {
    font-size: 13px; padding: 7px 9px; border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); background: var(--surface-2);
  }
  .lejant { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .lejant .nokta { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 2px; }

  .gunler { display: flex; flex-direction: column; gap: 8px; }
  .gun-satir { display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; }
  .gun-tarih { width: 92px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .gun-tarih .g-ad { font-size: 13px; font-weight: 700; color: var(--text); }
  .gun-tarih .g-tar { font-size: 12px; color: var(--text-2); }
  .g-bugun { font-size: 10px; background: var(--brand-bg); color: var(--brand); padding: 1px 7px; border-radius: 10px; }

  .cipler { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; align-content: flex-start; }
  .cip { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; min-width: 190px; flex: 1; }
  .cip.kilitli { border: 1.5px solid var(--accent); }
  .cip-ust { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .cip-ad { font-size: 13px; font-weight: 600; color: var(--text); }
  .cip-flag {
    margin-left: 6px; font-size: 10px; font-weight: 700; color: var(--amber);
    background: var(--uyari-bg); border-radius: 3px; padding: 1px 6px; cursor: pointer; white-space: nowrap;
  }
  .cip-flag:hover { color: #fff; background: var(--amber); }
  .cip-kilit { margin-left: auto; background: none; border: none; cursor: pointer; padding: 2px; font-size: 15px; line-height: 1; color: var(--text-muted); }
  .cip-kilit.acik { color: var(--accent); }
  .cip-bar-satir { display: flex; align-items: center; gap: 8px; }
  .cip-bar { flex: 1; height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
  .cip-bar-dolu { height: 100%; }
  .cip-yuzde { font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .cip-alt { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .gun-bos { flex: 1; font-size: 12px; color: var(--text-muted); align-self: center; }
  .plan-bos { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>

<div id="splash">
  <img src="/static/logo.png" alt="Horoz Lojistik" class="splash-firma">
  <div class="splash-logo">TOROS</div>
  <div class="splash-alt">Haftalık Plan</div>
</div>

<div class="ust-bar">
  <h1>TOROS</h1>
  <nav class="sekmeler">
    <a href="/">Rota Optimizasyonu</a>
    <a href="/filo">Filo Yönetimi</a>
    <a href="/plan" class="aktif">Haftalık Plan</a>
    <a href="/sofor">Şoför Yönetimi</a>
  </nav>
</div>

<div class="icerik">
  <div class="plan-baslik">
    <button class="btn btn-brand" id="btn-planla" onclick="haftalikPlanla()">Haftalık Planla</button>
    <select class="gun-sec" id="gun-sec" onchange="planDurumYukle()">
      <option value="7">7 gün</option>
      <option value="5">5 gün</option>
      <option value="14">14 gün</option>
    </select>
    <span class="tarih-araligi" id="tarih-araligi"></span>
    <span class="sigmadi-rozet" id="sigmadi-rozet" style="display:none;" onclick="sigmayanlariGoster()"></span>
  </div>

  <div class="lejant">
    <span>🔒 kesinleşmiş — plan dokunmaz</span>
    <span><span class="nokta" style="background:var(--teal);"></span> doluluk ≥ %80</span>
    <span><span class="nokta" style="background:var(--amber);"></span> yarım (termin zorladı)</span>
  </div>

  <div class="gunler" id="gunler"><div class="plan-bos">Yükleniyor…</div></div>
</div>

<script>
var sonSigmayanlar = [];
var planCakismalari = {};   // "tarih|bolge" -> [pencere cakisma grubu]

function planCakismaGoster(tarih, bolge) {
  var c = planCakismalari[tarih + '|' + bolge];
  if (!c || !c.length) return;
  var s = [bolge + ' · ' + tarih + ' — pencere çakışması (' + c.length + ' grup):', ''];
  c.forEach(function(g) {
    s.push('⚠ ' + g.pencere + ' → ' + g.teslimat_sayisi + ' teslimat sığmıyor'
      + ' (gereken ' + g.gereken_dk + 'dk > mevcut ' + g.mevcut_dk + 'dk)');
    g.teslimatlar.forEach(function(t) { s.push('    • ' + t.adi); });
    s.push('');
  });
  alert(s.join('\n'));
}
setTimeout(function() { document.getElementById('splash').classList.add('kapan'); }, 700);

function bugunISO() { return new Date().toISOString().slice(0, 10); }
function gunSayisi() { return parseInt(document.getElementById('gun-sec').value, 10); }

function tarihBicim(iso) {
  var aylar = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  var d = new Date(iso + 'T00:00');
  return d.getDate() + ' ' + aylar[d.getMonth()];
}

function araligiYaz(gunler) {
  if (!gunler.length) { document.getElementById('tarih-araligi').textContent = ''; return; }
  var ilk = tarihBicim(gunler[0].tarih);
  var son = tarihBicim(gunler[gunler.length - 1].tarih);
  document.getElementById('tarih-araligi').textContent = ilk + ' – ' + son + ' ' + new Date(gunler[0].tarih + 'T00:00').getFullYear();
}

function cipCiz(tarih, b) {
  var renk = b.doluluk >= 80 ? 'var(--teal)' : 'var(--amber)';
  var kilitli = b.kesin_adet > 0 && b.kesin_adet === b.teslimat_sayisi;
  var kilitClass = kilitli ? 'cip-kilit acik' : 'cip-kilit';
  var kilitIkon = kilitli ? '🔒' : '🔓';
  var cakisma = b.cakisma || [];
  planCakismalari[tarih + '|' + b.bolge] = cakisma;
  var flag = cakisma.length
    ? '<span class="cip-flag" title="Pencere çakışması — detay için tıkla"'
      + ' onclick="planCakismaGoster(\'' + tarih + '\', \'' + b.bolge.replace(/'/g, "\\'") + '\')">⚠ ' + cakisma.length + '</span>'
    : '';
  return '<div class="cip' + (kilitli ? ' kilitli' : '') + '">'
    + '<div class="cip-ust">'
    +   '<span class="cip-ad">' + b.bolge + '</span>' + flag
    +   '<button class="' + kilitClass + '" title="Kesinleştir / aç"'
    +     ' onclick="kilitToggle(\'' + tarih + '\', \'' + b.bolge.replace(/'/g, "\\'") + '\', ' + kilitli + ')">' + kilitIkon + '</button>'
    + '</div>'
    + '<div class="cip-bar-satir">'
    +   '<div class="cip-bar"><div class="cip-bar-dolu" style="width:' + Math.min(b.doluluk,100) + '%;background:' + renk + ';"></div></div>'
    +   '<span class="cip-yuzde">%' + Math.round(b.doluluk) + '</span>'
    + '</div>'
    + '<div class="cip-alt">' + (b.arac || 'araç yok') + ' · ' + b.teslimat_sayisi + ' teslimat</div>'
    + '</div>';
}

function takvimCiz(veri) {
  araligiYaz(veri.gunler);
  var bugun = bugunISO();
  var html = '';
  veri.gunler.forEach(function(g) {
    var bugunEt = g.tarih === bugun ? '<span class="g-bugun">bugün</span>' : '';
    var rotala = g.bolgeler.length
      ? '<button class="btn btn-kucuk" onclick="gunuRotala(\'' + g.tarih + '\')">Rotala</button>' : '';
    var icerik = g.bolgeler.length
      ? '<div class="cipler">' + g.bolgeler.map(function(b){ return cipCiz(g.tarih, b); }).join('') + '</div>'
      : '<div class="gun-bos">boş — çıkış yok</div>';
    html += '<div class="gun-satir">'
      + '<div class="gun-tarih">'
      +   '<span class="g-ad">' + g.gun_adi + '</span>'
      +   '<span class="g-tar">' + tarihBicim(g.tarih) + '</span>'
      +   bugunEt + rotala
      + '</div>' + icerik + '</div>';
  });
  document.getElementById('gunler').innerHTML = html || '<div class="plan-bos">Plan yok</div>';
}

function planDurumYukle() {
  fetch('/api/plan-durum?baslangic=' + bugunISO() + '&gun_sayisi=' + gunSayisi())
    .then(function(r){ return r.json(); })
    .then(takvimCiz)
    .catch(function(){ document.getElementById('gunler').innerHTML = '<div class="plan-bos">Plan alınamadı</div>'; });
}

function haftalikPlanla() {
  var btn = document.getElementById('btn-planla');
  btn.disabled = true; btn.textContent = 'Planlanıyor…';
  fetch('/api/haftalik-plan', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ baslangic: bugunISO(), gun_sayisi: gunSayisi() })
  })
  .then(function(r){ return r.json(); })
  .then(function(veri){
    btn.disabled = false; btn.textContent = 'Haftalık Planla';
    sonSigmayanlar = veri.sigmayanlar || [];
    takvimCiz(veri);
    var rozet = document.getElementById('sigmadi-rozet');
    if (sonSigmayanlar.length) {
      rozet.style.display = 'inline-block';
      rozet.textContent = '⚠ ' + sonSigmayanlar.length + ' teslimat plana sığmadı';
    } else { rozet.style.display = 'none'; }
  })
  .catch(function(){ btn.disabled = false; btn.textContent = 'Haftalık Planla'; alert('Planlama hatası'); });
}

function kilitToggle(tarih, bolge, suAnKilitli) {
  fetch('/api/plan/kesinlestir', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tarih: tarih, bolge: bolge, kesinlesmis: !suAnKilitli })
  })
  .then(function(r){ return r.json(); })
  .then(function(){ planDurumYukle(); })
  .catch(function(){ alert('Kesinleştirme hatası'); });
}

function gunuRotala(tarih) {
  if (!confirm(tarih + " günü rotalanacak (araçlara atanacak). Devam?")) return;
  fetch('/api/dagit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tarih: tarih })
  })
  .then(function(r){ return r.json(); })
  .then(function(veri){
    var o = veri.ozet || {};
    var satir = [(o.kullanilan_arac || 0) + ' araç rotalandı, ' + (o.atanan || 0) + ' teslimat'];
    if (o.acikta) satir.push(o.acikta + ' teslimat araca sığmadı');
    (veri.uyarilar || []).forEach(function(u){ satir.push('• ' + u); });
    alert(satir.join('\n'));
    planDurumYukle();
  })
  .catch(function(){ alert('Rotalama hatası'); });
}

function sigmayanlariGoster() {
  if (!sonSigmayanlar.length) return;
  var grup = {};
  sonSigmayanlar.forEach(function(s){ grup[s.neden] = (grup[s.neden] || 0) + 1; });
  var satir = ['Plana sığmayan ' + sonSigmayanlar.length + ' teslimat:', ''];
  Object.keys(grup).forEach(function(n){ satir.push('• ' + n + ': ' + grup[n]); });
  alert(satir.join('\n'));
}

planDurumYukle();
</script>
</body>
</html>
